<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>netduke32 — native-wasm Wine</title>
<style>
  body { margin: 0; background: #111; color: #ccc; font: 13px monospace; }
  #wrap { display: flex; gap: 12px; padding: 12px; }
  canvas { background: #000; image-rendering: pixelated; border: 1px solid #333; width: 1024px; height: 768px; max-width: 100%; }
  #side { width: 460px; }
  #status { color: #6f6; white-space: pre; margin-bottom: 8px; }
  #note { color: #888; margin-bottom: 8px; }
  #log { height: 640px; overflow: auto; background: #000; padding: 6px; border: 1px solid #333; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="wrap">
  <div>
    <canvas id="screen" width="1024" height="768"></canvas>
  </div>
  <div id="side">
    <div id="status">booting…</div>
    <div id="note">netduke32 via native-wasm Wine. Rendering 320×200 in a 640×400 window (edit /game/autoexec.cfg); Wine's own CRT block moves run natively.</div>
    <div id="log"></div>
  </div>
</div>
<script>
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
let lastW = 0, lastH = 0;

let frames = 0, lastFrames = 0, lastT = performance.now(), startT = lastT, firstFrameT = 0;
function tick() {
  const now = performance.now();
  const dt = (now - lastT) / 1000;
  if (dt >= 0.5) {
    const fps = (frames - lastFrames) / dt;
    lastFrames = frames; lastT = now;
    const ttf = firstFrameT ? ((firstFrameT - startT) / 1000).toFixed(1) + 's' : '—';
    const res = lastW ? `${lastW}×${lastH}` : '—';
    statusEl.textContent =
      `fps: ${fps.toFixed(1)}   render: ${res}   frames: ${frames}   first-frame: ${ttf}`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const worker = new Worker('worker.js');
worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === 'frame') {
    if (!firstFrameT) firstFrameT = performance.now();
    if (cv.width !== m.w || cv.height !== m.h) { cv.width = m.w; cv.height = m.h; }
    lastW = m.w; lastH = m.h;
    // The worker already produced RGBA, so wrap the transferred buffer in an
    // ImageData and blit it — no per-pixel conversion loop on the main thread.
    ctx.putImageData(new ImageData(new Uint8ClampedArray(m.rgba), m.w, m.h), 0, 0);
    frames++;
  } else if (m.type === 'log') {
    const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 4;
    logEl.textContent += m.line + '\n';
    if (logEl.textContent.length > 60000) logEl.textContent = logEl.textContent.slice(-40000);
    if (atBottom) logEl.scrollTop = logEl.scrollHeight;
  }
};
</script>
</body>
</html>
